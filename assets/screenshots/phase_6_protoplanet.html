<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MATTER SCATTER — Protoplanet</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#010108;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;display:flex;align-items:center;justify-content:center;}
#stage{width:1920px;height:1080px;position:relative;transform-origin:center center;flex-shrink:0;}
#c{display:block;position:absolute;inset:0;}
#hud-score{position:absolute;top:14px;right:18px;color:rgba(255,255,255,0.4);font-size:9px;letter-spacing:2px;}
#pause-btn{position:absolute;top:14px;left:16px;color:rgba(255,255,255,0.55);font-size:13px;padding:8px 12px;}
#phase-hud{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;}
#phase-name{color:rgba(255,255,255,0.4);font-size:8px;letter-spacing:3px;text-transform:uppercase;}
#formula-quick-btn{background:none;border:1px solid rgba(255,255,255,0.14);color:rgba(255,255,255,0.32);font-size:12px;width:24px;height:24px;border-radius:5px;display:flex;align-items:center;justify-content:center;padding:0;}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="1920" height="1080"></canvas>
  <div id="pause-btn">II</div>
  <div id="hud-score">SCORE&nbsp;&nbsp;864.1</div>
  <div id="phase-hud"><span id="phase-name">Protoplanet</span><button id="formula-quick-btn">⚛</button></div>
</div>
<script>
// ── Static marketing hero-shot — Phase 6 (Protoplanet) ───────────────────
// Real game drops the dark-space background bloom entirely by this phase
// (drawBgBloom() isn't called for gamePhase===6) in favor of a starfield +
// the growing planet itself — reproduced here with a scattered starfield
// and a planet body using the real moon highlight tones ('#b0a090' warm /
// '#a0b8d0' cool, from _drawP6Moon()) blended in as surface patches. See
// the Prelogue file for the general shared-recipe writeup.
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=1920,H=1080,CX=W/2,CY=H/2;
function fitStage(){const s=Math.min(window.innerWidth/W,window.innerHeight/H);document.getElementById('stage').style.transform=`scale(${s})`;}
fitStage();window.addEventListener('resize',fitStage);

function mixRgb(rgbStr,target,t){const p=rgbStr.split(',').map(Number);return`${Math.round(p[0]+(target[0]-p[0])*t)},${Math.round(p[1]+(target[1]-p[1])*t)},${Math.round(p[2]+(target[2]-p[2])*t)}`;}
function bolt(x1,y1,x2,y2,coreRgb,haloRgb,alpha){
  const segs=4+Math.floor(Math.random()*3);const pts=[{x:x1,y:y1}];
  for(let s=1;s<segs;s++){const t=s/segs,spread=18*(1-Math.abs(t-0.5)*1.8);pts.push({x:x1+(x2-x1)*t+(Math.random()-0.5)*spread,y:y1+(y2-y1)*t+(Math.random()-0.5)*spread});}
  pts.push({x:x2,y:y2});
  ctx.globalCompositeOperation='screen';
  const a=alpha*(0.6+Math.random()*0.4);
  ctx.strokeStyle=`rgba(${coreRgb},${a})`;ctx.lineWidth=1+Math.random()*0.8;
  ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.stroke();
  ctx.globalCompositeOperation='source-over';
}
function rockVerts(n){const v=[];for(let i=0;i<n;i++){v.push({a:(i/n)*Math.PI*2+(Math.random()-0.5)*(Math.PI*2/n)*0.35,r:0.65+Math.random()*0.6});}return v;}
function rock(cx,cy,r,verts,rot,rgbStr,alpha=1){
  ctx.fillStyle=`rgba(${rgbStr},${alpha})`;
  ctx.beginPath();
  verts.forEach((v,i)=>{const a=v.a+rot,rr=v.r*r,x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
  ctx.closePath();ctx.fill();
  ctx.fillStyle=`rgba(${mixRgb(rgbStr,[255,255,255],0.3)},${0.5*alpha})`;
  ctx.beginPath();ctx.arc(cx-r*0.28,cy-r*0.28,r*0.4,0,Math.PI*2);ctx.fill();
}
function ringPts(cx,cy,count,rMin,rMax){
  const pts=[];
  for(let i=0;i<count;i++){const a=(i/count)*Math.PI*2+(Math.random()-0.5)*(Math.PI*2/count)*0.7,r=rMin+Math.random()*(rMax-rMin);pts.push({x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r});}
  return pts;
}

const ROCK='140,134,128',WARM_MOON='176,160,144',COOL_MOON='160,184,208';
const WHITE_CORE='220,240,255',WHITE_HALO='255,255,255';

ctx.fillStyle='#010108';ctx.fillRect(0,0,W,H);

// Starfield
for(let i=0;i<220;i++){
  const x=Math.random()*W,y=Math.random()*H,r=0.6+Math.random()*1.6,a=0.2+Math.random()*0.6;
  ctx.fillStyle=`rgba(255,255,255,${a})`;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
}

// Small debris/rock chunks still drifting in, some with impact bolts toward the planet
const debris=ringPts(CX,CY,20,320,1250).map(p=>({...p,r:10+Math.random()*22}));
for(const d of debris){
  rock(d.x,d.y,d.r,rockVerts(7),Math.random()*Math.PI*2,ROCK,0.85);
  if(Math.random()<0.35)bolt(d.x,d.y,CX,CY,WHITE_CORE,WHITE_HALO,0.3);
}

// Player planet — large rounded body dead center, rocky-brown base with
// forming-ocean blue patches starting to show through
const planetR=230;
ctx.save();ctx.beginPath();ctx.arc(CX,CY,planetR,0,Math.PI*2);ctx.clip();
ctx.fillStyle='#8c8680';ctx.fillRect(CX-planetR,CY-planetR,planetR*2,planetR*2);
for(let i=0;i<7;i++){
  const a=Math.random()*Math.PI*2,r=Math.random()*planetR*0.8;
  const bx=CX+Math.cos(a)*r,by=CY+Math.sin(a)*r,br=planetR*(0.22+Math.random()*0.28);
  ctx.fillStyle='rgba(90,140,190,0.55)';ctx.beginPath();ctx.arc(bx,by,br,0,Math.PI*2);ctx.fill();
}
ctx.fillStyle='rgba(255,255,255,0.16)';ctx.beginPath();ctx.arc(CX-planetR*0.32,CY-planetR*0.32,planetR*0.55,0,Math.PI*2);ctx.fill();
ctx.restore();
ctx.strokeStyle='rgba(0,0,0,0.35)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(CX,CY,planetR,0,Math.PI*2);ctx.stroke();

// Two orbiting moons with faint elliptical orbit guides
function orbit(rx,ry){ctx.strokeStyle='rgba(255,255,255,0.10)';ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(CX,CY,rx,ry,0,0,Math.PI*2);ctx.stroke();}
orbit(planetR*1.9,planetR*0.62);
orbit(planetR*2.5,planetR*0.85);
rock(CX+planetR*1.9*Math.cos(0.6),CY+planetR*0.62*Math.sin(0.6),42,rockVerts(9),0.4,WARM_MOON);
rock(CX-planetR*2.5*Math.cos(1.1),CY-planetR*0.85*Math.sin(1.1),34,rockVerts(9),1.9,COOL_MOON);
</script>
</body>
</html>
