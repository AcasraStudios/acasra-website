<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MATTER SCATTER — Recombination</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#010108;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;display:flex;align-items:center;justify-content:center;}
#stage{width:1920px;height:1080px;position:relative;transform-origin:center center;flex-shrink:0;}
#c{display:block;position:absolute;inset:0;}
#hud-score{position:absolute;top:14px;right:18px;color:rgba(255,255,255,0.4);font-size:9px;letter-spacing:2px;}
#pause-btn{position:absolute;top:14px;left:16px;color:rgba(255,255,255,0.55);font-size:13px;padding:8px 12px;}
#phase-hud{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;}
#phase-name{color:rgba(255,255,255,0.4);font-size:8px;letter-spacing:3px;text-transform:uppercase;}
#formula-quick-btn{background:none;border:1px solid rgba(255,255,255,0.14);color:rgba(255,255,255,0.32);font-size:12px;width:24px;height:24px;border-radius:5px;display:flex;align-items:center;justify-content:center;padding:0;}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="1920" height="1080"></canvas>
  <div id="pause-btn">II</div>
  <div id="hud-score">SCORE&nbsp;&nbsp;541.8</div>
  <div id="phase-hud"><span id="phase-name">Recombination</span><button id="formula-quick-btn">⚛</button></div>
</div>
<script>
// ── Static marketing hero-shot — Phase 2 (Recombination) ─────────────────
// Full He-4 atoms: the same tetra-nucleon + bond-line + orbiting-electron
// recipe used for the splash-screen loading icon (drawSplashAtomIcon), at
// gameplay scale/color here instead of the splash icon's grey-to-white
// treatment. See the Prelogue file for the shared-recipe writeup.
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=1920,H=1080,CX=W/2,CY=H/2;
function fitStage(){const s=Math.min(window.innerWidth/W,window.innerHeight/H);document.getElementById('stage').style.transform=`scale(${s})`;}
fitStage();window.addEventListener('resize',fitStage);

function mixRgb(rgbStr,target,t){const p=rgbStr.split(',').map(Number);return`${Math.round(p[0]+(target[0]-p[0])*t)},${Math.round(p[1]+(target[1]-p[1])*t)},${Math.round(p[2]+(target[2]-p[2])*t)}`;}
function sphere(x,y,r,rgbStr,alpha=1){
  const lx=x-r*0.38,ly=y-r*0.4;
  const lit=mixRgb(rgbStr,[255,255,255],0.85),shadow=mixRgb(rgbStr,[0,0,0],0.62);
  const g=ctx.createRadialGradient(lx,ly,r*0.05,x,y,r*1.05);
  g.addColorStop(0,`rgba(${lit},${0.95*alpha})`);g.addColorStop(0.35,`rgba(${rgbStr},${0.95*alpha})`);g.addColorStop(1,`rgba(${shadow},${0.95*alpha})`);
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
}
function glow(x,y,r,rgbStr,alpha){
  ctx.globalCompositeOperation='screen';
  const g=ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,`rgba(${rgbStr},${alpha})`);g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  ctx.globalCompositeOperation='source-over';
}
function bolt(x1,y1,x2,y2,coreRgb,haloRgb,alpha){
  const segs=4+Math.floor(Math.random()*3);const pts=[{x:x1,y:y1}];
  for(let s=1;s<segs;s++){const t=s/segs,spread=22*(1-Math.abs(t-0.5)*1.8);pts.push({x:x1+(x2-x1)*t+(Math.random()-0.5)*spread,y:y1+(y2-y1)*t+(Math.random()-0.5)*spread});}
  pts.push({x:x2,y:y2});
  ctx.globalCompositeOperation='screen';
  const a=alpha*(0.6+Math.random()*0.4);
  ctx.strokeStyle=`rgba(${coreRgb},${a})`;ctx.lineWidth=1+Math.random()*0.8;
  ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.stroke();
  ctx.strokeStyle=`rgba(${haloRgb},${a*0.3})`;ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.stroke();
  ctx.globalCompositeOperation='source-over';
}
function bgBloom(rgbArr,alpha){
  ctx.globalCompositeOperation='lighter';
  const positions=[[0.22,0.22],[0.78,0.22],[0.22,0.82],[0.78,0.82],[0.5,0.5]];
  for(const[fx,fy]of positions){
    const x=W*fx+(Math.random()-0.5)*W*0.1,y=H*fy+(Math.random()-0.5)*H*0.1,r=380+Math.random()*220;
    const g=ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,`rgba(${rgbArr[0]},${rgbArr[1]},${rgbArr[2]},${alpha})`);g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalCompositeOperation='source-over';
}
function ringPts(cx,cy,count,rMin,rMax){
  const pts=[];
  for(let i=0;i<count;i++){const a=(i/count)*Math.PI*2+(Math.random()-0.5)*(Math.PI*2/count)*0.7,r=rMin+Math.random()*(rMax-rMin);pts.push({x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r});}
  return pts;
}

const QC={red:'255,51,85',blue:'68,153,255',purple:'204,68,255',white:'232,244,255'};
const AMBER_CORE='255,150,40',AMBER_HALO='255,60,10';

ctx.fillStyle='#010108';ctx.fillRect(0,0,W,H);
bgBloom([195,55,35],0.26); // real Phase 2 BLOOM_TARGETS entry

// Full He-4 atom — nucleus (4 nucleons, real 2:1 ring-radius:nucleon-radius
// ratio) + bond lines + 2 electrons on the real 1.55:0.52 elliptical orbit,
// tilt 0.5 rad — all matching the real drawOrbitingElectrons()/He-4 clump
// proportions.
function drawAtom(cx,cy,scale,t){
  const nR=15*scale,ringR=nR*2;
  const nucPos=[];
  for(let i=0;i<4;i++){const a=-Math.PI/2+i*(Math.PI/2);nucPos.push({x:cx+Math.cos(a)*ringR,y:cy+Math.sin(a)*ringR,col:i%2===0?'red':'blue'});}
  for(let i=0;i<4;i++)for(let j=i+1;j<4;j++)bolt(nucPos[i].x,nucPos[i].y,nucPos[j].x,nucPos[j].y,'200,220,255','180,200,240',0.22);
  for(const p of nucPos)glow(p.x,p.y,nR*4,QC[p.col],0.16);
  for(const p of nucPos)sphere(p.x,p.y,nR,QC[p.col]);
  const orbitR=ringR*1.3,tilt=0.5;
  ctx.save();ctx.translate(cx,cy);ctx.rotate(tilt);
  ctx.strokeStyle='rgba(232,244,255,0.18)';ctx.lineWidth=1;
  ctx.beginPath();ctx.ellipse(0,0,orbitR*1.55,orbitR*0.52,0,0,Math.PI*2);ctx.stroke();
  ctx.restore();
  const eR=nR*0.42;
  for(let i=0;i<2;i++){
    const ang=t+i*Math.PI;
    const ex=cx+Math.cos(tilt)*(Math.cos(ang)*orbitR*1.55)-Math.sin(tilt)*(Math.sin(ang)*orbitR*0.52);
    const ey=cy+Math.sin(tilt)*(Math.cos(ang)*orbitR*1.55)+Math.cos(tilt)*(Math.sin(ang)*orbitR*0.52);
    glow(ex,ey,eR*5,QC.purple,0.4);sphere(ex,ey,eR,QC.white);
  }
  return nucPos.map(p=>({x:p.x,y:p.y}));
}

const allPts=[];
for(const c of ringPts(CX,CY,17,190,1280)){
  const s=0.7+Math.random()*0.6,t=Math.random()*Math.PI*2;
  allPts.push(...drawAtom(c.x,c.y,s,t),c);
}
for(let i=0;i<allPts.length;i++)for(let j=i+1;j<allPts.length;j++){
  const dx=allPts[i].x-allPts[j].x,dy=allPts[i].y-allPts[j].y,d=Math.sqrt(dx*dx+dy*dy);
  if(d<140&&Math.random()<0.14)bolt(allPts[i].x,allPts[i].y,allPts[j].x,allPts[j].y,AMBER_CORE,AMBER_HALO,0.5);
}

// Player — the largest He-4 atom, dead center
drawAtom(CX,CY,2.1,1.1);
</script>
</body>
</html>
